exclude: '^(app/calculation_render/templates/(namkha\.svg|data\.json|preview\.pdf)|app/static/htmx\.min\.js|app/calculation_render/fonts/)'

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
      - id: debug-statements          # stray pdb/breakpoint
      - id: check-xml                 # well-form of tracked SVGs (illustration/logo)
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/python-poetry/poetry
    rev: 2.4.1
    hooks:
      - id: poetry-check
        args: ['--lock']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        files: '^app/'

  # typstyle as a system hook: the upstream rust-build hook fails to compile here
  # (unlocked cargo install pulls a conflicting vergen-lib). Install once with:
  #   cargo install --locked typstyle
  - repo: local
    hooks:
      - id: typstyle
        name: typstyle (format .typ)
        entry: typstyle -i        # in-place; per-node opt-out via `// @typstyle off`
        language: system
        files: '\.typ$'

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
