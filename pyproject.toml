[project]
name = "namkha-webapp"
version = "0.1.0"
description = "Web app to calculate a Namkha and organize results in a downloadable calculation sheet"
authors = [{ name = "Namkha Encyclopedia" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "namkha-calculator (>=0.1.0a3)",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "lxml>=5.2",
    "typst>=0.14",
    "pytz>=2025.2",
    "timezonefinder (>=8.2.4,<9.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0"
mypy = "^1.14"
httpx2 = "^2.4.0"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true          # skyfield/typst/namkha_calculator untyped
check_untyped_defs = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
