[project]
name = "namkha-webapp"
version = "0.1.0a1"
description = "Web app to calculate a Namkha and organize results in a downloadable calculation sheet"
authors = [{ name = "Namkha Encyclopedia" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "namkha-calculator (>=0.1.0a4)",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "lxml>=5.2",
    "typst>=0.14",
    "timezonefinder (>=8.2.4,<9.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0"
mypy = "^1.14"
pytest = "^8.0"         # also pulled into the browser group via pytest-playwright, which
                        # caps it (<9). Shared version: a pytest major bump must clear both
                        # groups or `poetry lock` fails, even though browser is opt-in.
httpx = ">=0.27"        # required by Starlette's TestClient (it does `import httpx`)

# Browser E2E layer, opt-in and ADDITIVE on top of dev (reuses dev's pytest). Supported installs:
#   poetry install                  -> backend suite (dev: pytest + httpx)
#   poetry install --with browser   -> backend + browser (+ `playwright install chromium`)
# `--only browser` is unsupported: it drops main + httpx, but tests/conftest.py imports
# starlette.testclient (needs httpx) for every test, so collection errors.
[tool.poetry.group.browser]
optional = true

[tool.poetry.group.browser.dependencies]
pytest-playwright = "^0.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]      # repo root, so `import app` works (package-mode = false, no install)
addopts = "--strict-markers"
markers = [
    "browser: end-to-end tests that drive a real browser via Playwright (opt-in)",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true          # skyfield/typst/namkha_calculator untyped
check_untyped_defs = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
