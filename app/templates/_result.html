{% if error %}
  <p class="error" role="alert">{{ error }}</p>
{% else %}
  <div class="download">
    <form method="post" action="/download.pdf">
      <input type="hidden" name="result_id" value="{{ result_id }}">
      <input type="hidden" name="session_token" value="{{ session_token }}">
      <button type="submit" class="download-link">
        <img src="/static/img/download.svg" alt="">
        Download PDF
      </button>
    </form>
  </div>
  <div class="diagrams">
    <p class="hint sheet-scroll-hint">Tap or click a page to enlarge and zoom, or download the PDF above.</p>
    <div class="sheet" role="img" aria-label="{{ sheet_label }}">{{ svg | safe }}</div>
  </div>
{% endif %}
